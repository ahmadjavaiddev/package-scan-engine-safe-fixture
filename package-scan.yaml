schemaVersion: 1
packageManager: npm
build:
  adapter: typescript
  command:
    - npm
    - run
    - build
  outputs:
    - dist/**
permissions:
  build:
    filesystem:
      read:
        - index.ts
        - is-number.d.ts
        - tsconfig.json
      write:
        - dist
        - dist/**
scenarios:
  - id: import-esm
    type: import
    entrypoint: .
